[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oasis-simulation"
version = "0.2.0"
description = "Prototype 2-D urban cooling simulator for shade, misting and reflective pavement"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
dev = ["pytest>=7.0", "matplotlib>=3.3"]

[project.scripts]
oasis = "oasis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oasis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]
